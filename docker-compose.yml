# OSS-only app services. Shared infrastructure (MongoDB, Redis) lives in the
# repo-root docker-compose.yml — start it first:
#   cd .. && docker compose up -d mongodb redis

name: formulai-oss

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/formulai
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: http://localhost
    env_file:
      - ./server/.env
    networks:
      - formulai-network
    ports:
      - "3001:3001"

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/formulai
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    env_file:
      - ./server/.env
    networks:
      - formulai-network
    working_dir: /app/server
    command: ["node", "dist/src/worker"]

  gateway:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - formulai-network

networks:
  formulai-network:
    external: true
    name: formulai-network
