packages:
  - client
  - server
  - packages/plugin-interface

# Transitive security patches only. Prefer bumping direct deps in client/server
# package.json; re-run `pnpm audit` after changes.
overrides:
  ajv: '>=8.18.0'
  file-type: '>=21.3.2'
  lodash: '>=4.18.0'
  path-to-regexp: '>=8.4.0'
  picomatch: '>=4.0.4'
  serialize-javascript: '>=7.0.5'
  axios: '>=1.18.0 <2'
  nodemailer: '>=10.0.9 <11'
  postcss: '>=8.5.23 <9'
  vite: '>=6.4.3 <7'
  vitest: '>=4.1.0 <5'
  react-router: '>=7.18.2 <8'
  react-router-dom: '>=7.18.2 <8'
  browserslist: '>=4.28.7 <5'
  fast-uri: '>=3.1.6 <4'
  form-data: '>=4.0.6 <5'
  multer: '>=2.3.0 <3'
  nanoid: '>=3.3.18'
  sharp: '>=0.35.5 <1'
  shell-quote: '>=1.11.0 <2'
  tmp: '>=0.2.6 <1'
  ws: '>=8.21.0 <9'
  adm-zip: '>=0.6.1 <1'
  handlebars: '>=4.7.10 <5'
  proxy-addr: '>=2.0.8 <3'
  source-map-js: '>=1.2.2 <2'
  '@grpc/grpc-js': '>=1.14.5'
  qs: '>=6.16.0 <7'
  fflate: '>=0.8.3 <1'
  protobufjs: '>=7.6.5'
  body-parser: '>=2.3.0 <3'
  '@babel/core': '>=7.29.6'
  '@humanfs/node': '>=0.16.8'
  '@opentelemetry/core': '>=2.8.0'
  # uuid 11 keeps CJS for bull/langgraph; 13+ is ESM-first
  uuid: '>=11.1.1 <12'
  'js-yaml@3': '>=3.15.2'
  'js-yaml@4': '>=4.3.2'
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
  '@opentelemetry/exporter-prometheus': '>=0.217.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  '@opentelemetry/sdk-node': '>=0.217.0'
  'postcss-selector-parser@6': '>=6.1.3'

# Unpatched advisories. braces is high and would fail `pnpm audit --audit-level=high`.
# It is reachable only through Tailwind/chokidar at client build time; no 3.0.4+ release exists.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
